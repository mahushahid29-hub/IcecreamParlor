services:
  database:
    build:
      context: ./database
    container_name: icecream-db
    volumes:
      - db_data:/data
    networks:
      - icecream-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: icecream-backend
    environment:
      - DB_PATH=/data/orders.db
    volumes:
      - db_data:/data
    ports:
      - "5000:5000"
    networks:
      - icecream-network
    depends_on:
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    build:
      context: ./frontend
    container_name: icecream-frontend
    ports:
      - "80:80"
    networks:
      - icecream-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  icecream-network:
    driver: bridge
